<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rekindle Nudge</title>
<style>
 :root{--bg:#0b1220;--card:#131c2e;--fg:#eef2f8;--muted:#8a97ad;--acc:#ff7a45;--wa:#25d366}
 body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;}
 .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
 .card{background:var(--card);border-radius:18px;padding:16px}
 h1{font-size:22px;margin:4px 0} .muted{color:var(--muted);font-size:14px;line-height:1.4}
 img{width:100%;border-radius:14px;display:block}
 textarea{width:100%;box-sizing:border-box;min-height:170px;background:#0e1626;color:var(--fg);border:1px solid #26344f;border-radius:12px;padding:12px;font-size:16px;line-height:1.4;font-family:inherit}
 button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;text-decoration:none;margin-top:10px}
 .wa{background:var(--wa);color:#05210f} .sec{background:#1d2a44;color:var(--fg)}
 .tag{display:inline-block;background:#2a1d17;color:var(--acc);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;text-transform:uppercase}
</style></head>
<body><div class="wrap">
 <div class="card"><span class="tag" id="kind">nudge</span><h1 id="who">…</h1><div class="muted" id="why"></div></div>
 <div class="card"><div class="muted" style="margin-bottom:8px">Draft — edit if you like, then send</div><textarea id="draft"></textarea>
  <a class="btn wa" id="open">Open WhatsApp chat with draft</a>
  <button class="sec" id="share">Share infographic + text…</button>
  <div class="muted" style="margin-top:8px" id="hint"></div></div>
 <div class="card" id="imgcard"><img id="img" alt="Infographic for this nudge"></div>
 <div class="card"><div class="muted" id="ctx"></div></div>
</div>
<script>
const id = location.pathname.split('/').pop();
let N;
function link(){ const t = encodeURIComponent(document.getElementById('draft').value);
  return N.phone_digits ? `https://wa.me/${N.phone_digits}?text=${t}` : `https://wa.me/?text=${t}`; }
fetch('/api/nudge/'+id).then(r=>r.json()).then(n=>{ N=n; const c=n.contact;
  document.getElementById('kind').textContent = n.trigger.kind || 'nudge';
  document.getElementById('who').textContent = 'Reconnect with ' + c.name + (c.company? ' · '+c.company:'');
  document.getElementById('why').textContent = n.reason + ' — Trigger: ' + n.trigger.title;
  document.getElementById('draft').value = n.draft;
  if(n.img_url) document.getElementById('img').src = n.img_url; else document.getElementById('imgcard').style.display='none';
  document.getElementById('ctx').innerHTML = `<b>Memory:</b> met at ${c.met_where||'?'} (${c.met_when||'?'}). Talked about ${(c.topics||[]).join(', ')}.`+
    (c.my_promises&&c.my_promises.length? `<br><b>You promised:</b> ${c.my_promises.join('; ')}`:'');
  document.getElementById('hint').textContent = n.phone_digits ? '' : 'No number saved — WhatsApp will ask you to pick the chat.';
});
document.getElementById('open').onclick = e => { e.preventDefault();
  fetch(`/api/nudge/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"status":"opened"}'});
  location.href = link(); };
document.getElementById('share').onclick = async () => {
  const text = document.getElementById('draft').value;
  try { const blob = await (await fetch(N.img_url)).blob(); const f = new File([blob],'rekindle.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.clipboard.writeText(text).catch(()=>{});
      await navigator.share({files:[f], text}); document.getElementById('hint').textContent='Text also copied — paste as caption if WhatsApp drops it.'; return; }
  } catch(e){}
  location.href = link();
};
</script></body></html>
